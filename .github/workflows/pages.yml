name: Deploy data site to Pages

# Build the static xcpc-rating data site and publish it to GitHub Pages.
# The exporter replays the incremental-ladder backtest (the single scoring rule)
# over the official srk-collection and emits the JSON contract the Vite/React
# frontend consumes (both the all-participation and official-only boards).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify upstream-only data source
        run: python scripts/verify_upstream_only.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve the official srk-collection revision
        id: srk-revision
        shell: bash
        run: |
          set -euo pipefail
          srk_sha="$(
            git ls-remote https://github.com/algoux/srk-collection.git \
              refs/heads/master | cut -f1
          )"
          test -n "$srk_sha"
          echo "sha=$srk_sha" >> "$GITHUB_OUTPUT"

      - name: Restore the srk-collection Git object cache
        id: srk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/srk-collection.git
          key: srk-collection-git-${{ runner.os }}-${{ steps.srk-revision.outputs.sha }}
          restore-keys: |
            srk-collection-git-${{ runner.os }}-

      - name: Incrementally update the official srk-collection
        shell: bash
        env:
          SRK_GIT_DIR: ${{ runner.temp }}/srk-collection.git
          SRK_WORKTREE: ${{ runner.temp }}/srk-collection
          SRK_SHA: ${{ steps.srk-revision.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! -f "$SRK_GIT_DIR/HEAD" ]]; then
            git init --bare "$SRK_GIT_DIR"
            git --git-dir="$SRK_GIT_DIR" remote add origin \
              https://github.com/algoux/srk-collection.git
          else
            git --git-dir="$SRK_GIT_DIR" remote set-url origin \
              https://github.com/algoux/srk-collection.git
          fi

          if ! git --git-dir="$SRK_GIT_DIR" cat-file -e "${SRK_SHA}^{commit}"; then
            git --git-dir="$SRK_GIT_DIR" fetch --depth 1 origin "$SRK_SHA"
          fi

          mkdir -p "$SRK_WORKTREE"
          git --git-dir="$SRK_GIT_DIR" archive "$SRK_SHA" official |
            tar -x -C "$SRK_WORKTREE"
          test -d "$SRK_WORKTREE/official"

      - name: Save the srk-collection Git object cache
        if: steps.srk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/srk-collection.git
          key: srk-collection-git-${{ runner.os }}-${{ steps.srk-revision.outputs.sha }}

      - name: Export the static data bundle
        run: |
          PYTHONPATH=src python -m xcpc_rating.export_web \
            --data "${RUNNER_TEMP}/srk-collection/official" \
            --out  web/public/data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build the frontend
        working-directory: web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions build type) on first run if not yet enabled.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
