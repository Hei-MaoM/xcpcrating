<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="xcpc rating — 竞赛选手积分与赛事数据站：积分榜单、赛前预测与表现分轨迹。"
    />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Start the default board before React boots. These requests are reused by
         the fetch cache when RatingsBoard mounts. -->
    <link
      rel="preload"
      href="./data/leaderboards/official/meta.json"
      as="fetch"
      crossorigin
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./data/leaderboards/official/pages/1.json"
      as="fetch"
      crossorigin
      fetchpriority="high"
    />

    <title>xcpc rating | 选手积分与赛事数据</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
